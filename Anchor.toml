[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

# Real generated dev keypair (target/deploy/ssr_protocol-keypair.json, NOT
# committed -- gitignored). Generated via solana-keygen once a native Rust
# toolchain became available this session (see docs/protocol/DEVNET_RUNBOOK.md
# and DEC-0023). This is a DevNet-only development authority; it will need to
# migrate to a multisig before any restricted beta (see DEC-0015).
[programs.localnet]
ssr_protocol = "2dURvmSdHeyaFES5rxaE1zgPSHCBLW5BLNguJ2Tu1mkW"
ssr_devnet_amm = "AJbXGWSU1x9LtJW7uRKJCwS3JZYqXwqHXpX6erY7dS6c"

[programs.devnet]
ssr_protocol = "2dURvmSdHeyaFES5rxaE1zgPSHCBLW5BLNguJ2Tu1mkW"
# DevNet-only test AMM (DEC-0051), reworked to a devUSDC hub (see DEC entry
# for this pass) -- deliberately separate program ID from ssr_protocol
# above; never intended for Mainnet.
ssr_devnet_amm = "AJbXGWSU1x9LtJW7uRKJCwS3JZYqXwqHXpX6erY7dS6c"

# Note: the [registry] section was removed in Anchor 1.0 (see
# docs/protocol/DEVNET_RUNBOOK.md for the Anchor/Solana version this workspace
# targets and why -- crates.io shows anchor-lang 1.1.2 as current stable at
# the time this workspace was scaffolded).

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 10000

[test.validator]
url = "https://api.devnet.solana.com"
