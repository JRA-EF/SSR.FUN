<!DOCTYPE html>
<html lang="en">
<head>

<title>SSR.fun — Application Architecture Map</title>
<style>
  :root{
    color-scheme: dark;
    --bg: #0a0a0e;
    --bg-2: #0f0f15;
    --surface: #14141c;
    --surface-2: #191924;
    --surface-hover: #1f1f2c;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --text: #eeeef4;
    --text-2: #a3a3b8;
    --text-3: #6e6e85;
    --accent: #8b5cf6;
    --accent-2: #a78bfa;
    --accent-soft: rgba(139,92,246,0.14);
    --accent-border: rgba(139,92,246,0.4);
    --green: #34d399;
    --green-soft: rgba(52,211,153,0.14);
    --amber: #fbbf24;
    --amber-soft: rgba(251,191,36,0.14);
    --red: #f87171;
    --red-soft: rgba(248,113,113,0.14);
    --blue: #60a5fa;
    --blue-soft: rgba(96,165,250,0.14);
    --gray: #9297a6;
    --gray-soft: rgba(146,151,166,0.14);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    --radius: 10px;
    --radius-lg: 14px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: radial-gradient(1200px 600px at 20% -10%, rgba(139,92,246,0.08), transparent),
                radial-gradient(900px 500px at 100% 0%, rgba(96,165,250,0.05), transparent),
                var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    min-height: 100vh;
  }
  ::selection{ background: var(--accent-soft); color: var(--text); }
  a{ color: var(--accent-2); text-decoration: none; }
  a:hover{ text-decoration: underline; }
  code, .mono{ font-family: var(--mono); font-size: 0.88em; }
  ::-webkit-scrollbar{ height: 10px; width: 10px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--border-strong); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover{ background: var(--text-3); }

  /* ---------- Top bar ---------- */
  header.topbar{
    position: sticky; top:0; z-index: 40;
    display:flex; align-items:center; gap:20px;
    padding: 0 20px;
    height: 56px;
    background: rgba(10,10,14,0.82);
    backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; }
  .brand .dot{ width:9px;height:9px;border-radius:50%; background: linear-gradient(135deg,var(--accent),var(--blue)); box-shadow: 0 0 12px rgba(139,92,246,0.6); }
  .brand small{ display:block; color: var(--text-3); font-weight: 400; font-size: 11px; margin-top: -2px;}
  nav.tabs{ display:flex; gap:2px; overflow-x:auto; flex:1; scrollbar-width:none; }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    all: unset; cursor:pointer; white-space:nowrap;
    padding: 8px 13px; border-radius: 8px; font-size: 13px; color: var(--text-2);
    transition: background .15s, color .15s;
  }
  nav.tabs button:hover{ background: var(--surface-hover); color: var(--text); }
  nav.tabs button.active{ background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
  .topbar-meta{ color: var(--text-3); font-size: 11px; white-space:nowrap; }

  main{ max-width: 1400px; margin: 0 auto; padding: 28px 20px 100px; }
  section.view{ display:none; animation: fadein .18s ease; }
  section.view.active{ display:block; }
  @keyframes fadein{ from{ opacity:0; transform: translateY(4px);} to{opacity:1; transform:none;} }

  h1.page-title{ font-size: 22px; font-weight: 650; letter-spacing:-0.02em; margin: 0 0 6px; }
  p.page-sub{ color: var(--text-2); margin: 0 0 28px; max-width: 780px; }

  .card{
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
  }
  .grid{ display:grid; gap: 14px; }
  .grid.cols-2{ grid-template-columns: repeat(2, 1fr); }
  .grid.cols-3{ grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 900px){ .grid.cols-2, .grid.cols-3{ grid-template-columns: 1fr; } }

  .badge{
    display:inline-flex; align-items:center; gap:5px;
    font-size: 10.5px; font-weight: 700; letter-spacing:.04em; text-transform:uppercase;
    padding: 3px 8px; border-radius: 999px; line-height:1.4;
    border: 1px solid transparent;
  }
  .badge .dot{ width:6px; height:6px; border-radius:50%; }
  .badge.real{ background: var(--green-soft); color: var(--green); border-color: rgba(52,211,153,.25);}
  .badge.real .dot{ background: var(--green); }
  .badge.hybrid{ background: var(--amber-soft); color: var(--amber); border-color: rgba(251,191,36,.25);}
  .badge.hybrid .dot{ background: var(--amber); }
  .badge.simulated{ background: var(--gray-soft); color: var(--gray); border-color: rgba(146,151,166,.25);}
  .badge.simulated .dot{ background: var(--gray); }
  .badge.planned, .badge.not_started{ background: var(--blue-soft); color: var(--blue); border-color: rgba(96,165,250,.25);}
  .badge.planned .dot, .badge.not_started .dot{ background: var(--blue); }
  .badge.abandoned{ background: var(--red-soft); color: var(--red); border-color: rgba(248,113,113,.25);}
  .badge.abandoned .dot{ background: var(--red); }

  .pill{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-2); }

  /* ---------- Overview ---------- */
  .overview-hero{ padding: 22px 24px; margin-bottom: 18px; }
  .overview-hero h2{ margin:0 0 8px; font-size:17px; }
  .overview-hero p{ margin:0; color:var(--text-2); }
  .maturity-bar{ height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; border:1px solid var(--border); margin-top:10px;}
  .maturity-bar > div{ height:100%; background: linear-gradient(90deg,var(--accent),var(--blue)); }
  .phase-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; padding:6px 0; border-bottom:1px dashed var(--border); }
  .phase-row:last-child{ border-bottom:none; }
  .phase-row .name{ flex:1; color:var(--text); }
  .phase-row .pct{ width:42px; text-align:right; color:var(--text-2); font-family:var(--mono); font-size:11.5px;}
  .boundary-list{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .boundary-list li{ padding-left:18px; position:relative; color:var(--text-2); font-size:13px; }
  .boundary-list li::before{ content:"◆"; position:absolute; left:0; color:var(--accent); font-size:9px; top:5px; }

  /* ---------- System map ---------- */
  .map-toolbar{ display:flex; align-items:center; gap:12px; margin-bottom: 14px; flex-wrap:wrap; }
  select, input[type=text]{
    background: var(--surface); border:1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 8px; font-size: 13px; font-family: var(--sans);
  }
  select:focus, input:focus{ outline:none; border-color: var(--accent-border); }
  .flow-status-line{ display:none; margin-bottom:14px; }
  .flow-status-line.show{ display:block; }
  .map-scroll{ overflow-x:auto; border:1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-2); padding: 20px; }
  .map-content{ position:relative; width: fit-content; }
  .map-lines{ position:absolute; top:0; left:0; pointer-events:none; overflow:visible; }
  .map-columns{ display:flex; gap:16px; align-items:flex-start; position:relative; z-index:1; }
  .map-col{ width: 216px; flex-shrink:0; }
  .map-col-head{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3); padding: 0 4px 10px; }
  .node-chip{
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding: 10px 11px; margin-bottom: 8px; cursor:pointer; transition: all .15s;
    position:relative;
  }
  .node-chip:hover{ background: var(--surface-hover); border-color: var(--border-strong); transform: translateY(-1px); }
  .node-chip .label{ font-size:12.5px; font-weight:600; margin-bottom:4px; }
  .node-chip .kind{ font-size:10.5px; color:var(--text-3); font-family: var(--mono); }
  .node-chip .status-dot{ position:absolute; top:10px; right:10px; width:7px; height:7px; border-radius:50%; }
  .status-dot.real{ background:var(--green); box-shadow:0 0 6px rgba(52,211,153,.6);}
  .status-dot.hybrid{ background:var(--amber); box-shadow:0 0 6px rgba(251,191,36,.6);}
  .status-dot.simulated{ background:var(--gray); }
  .status-dot.planned, .status-dot.not_started{ background:var(--blue); }
  .status-dot.abandoned{ background:var(--red); }
  .node-chip.dimmed{ opacity: 0.22; }
  .node-chip.highlighted{ border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 18px rgba(139,92,246,.35); background: var(--accent-soft); }

  /* ---------- Detail panel ---------- */
  .overlay{ position:fixed; inset:0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); z-index:60; opacity:0; pointer-events:none; transition:opacity .18s; }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .panel{
    position:fixed; top:0; right:0; height:100%; width: 420px; max-width:92vw;
    background: var(--surface); border-left:1px solid var(--border-strong);
    z-index:61; transform: translateX(100%); transition: transform .22s ease;
    display:flex; flex-direction:column; box-shadow: -20px 0 60px rgba(0,0,0,.5);
  }
  .panel.show{ transform: translateX(0); }
  .panel-head{ padding: 18px 20px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .panel-head h3{ margin:0 0 6px; font-size:16px; }
  .panel-close{ all:unset; cursor:pointer; color:var(--text-2); font-size:20px; line-height:1; padding:4px; }
  .panel-close:hover{ color: var(--text); }
  .panel-body{ padding: 16px 20px; overflow-y:auto; flex:1; }
  .panel-section{ margin-bottom: 18px; }
  .panel-section h4{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-3); margin:0 0 8px; }
  .file-chip{ display:inline-block; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:3px 8px; font-family:var(--mono); font-size:11.5px; margin:0 6px 6px 0; color: var(--accent-2); }
  .rel-chip{ display:inline-block; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px 10px; font-size:11.5px; margin:0 6px 6px 0; color:var(--text-2); cursor:pointer; }
  .rel-chip:hover{ border-color: var(--accent-border); color: var(--accent-2); }
  .limitation-item{ font-size:12.5px; color:var(--amber); background:var(--amber-soft); border:1px solid rgba(251,191,36,.2); border-radius:8px; padding:8px 10px; margin-bottom:6px; }

  /* ---------- Flows tab ---------- */
  .flow-list{ display:grid; gap:10px; margin-bottom: 22px; }
  .flow-card{ padding:14px 16px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .flow-card:hover{ border-color: var(--border-strong); }
  .flow-card .fname{ font-weight:600; font-size:13.5px; }
  .flow-card .fcat{ color:var(--text-3); font-size:11.5px; margin-top:2px; }
  .flow-detail{ display:none; }
  .flow-detail.show{ display:block; }
  .step-item{ display:flex; gap:14px; padding: 12px 0; border-bottom: 1px dashed var(--border); }
  .step-item:last-child{ border-bottom:none; }
  .step-num{ flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--accent-2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .step-desc{ font-size:13px; color: var(--text); margin-bottom:6px; }
  .back-link{ all:unset; cursor:pointer; color:var(--accent-2); font-size:12.5px; margin-bottom:14px; display:inline-block; }

  /* ---------- Repository ---------- */
  .repo-group{ margin-bottom:10px; }
  .repo-group summary{ cursor:pointer; padding:12px 16px; list-style:none; display:flex; align-items:center; gap:10px; }
  .repo-group summary::-webkit-details-marker{ display:none; }
  .repo-group summary::before{ content:"▸"; color:var(--text-3); transition: transform .15s; font-size:11px;}
  .repo-group[open] summary::before{ transform: rotate(90deg); }
  .repo-group .rg-title{ font-weight:600; font-size:13.5px; }
  .repo-group .rg-body{ padding: 4px 16px 16px 40px; color: var(--text-2); font-size:12.5px; }
  .repo-group .rg-paths{ margin-top:8px; }
  .class-badge{ font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:5px; font-weight:700;}
  .class-active-product-code{ background:var(--green-soft); color:var(--green); }
  .class-protocol-code{ background:var(--blue-soft); color:var(--blue); }
  .class-scripts{ background:var(--accent-soft); color:var(--accent-2); }
  .class-tests{ background:rgba(96,165,250,.14); color:#93c5fd; }
  .class-documentation{ background:var(--gray-soft); color:var(--gray); }
  .class-generated-assets{ background:rgba(255,255,255,.06); color:var(--text-3); }
  .class-infrastructure{ background:rgba(167,139,250,.14); color:var(--accent-2); }
  .class-inactive-or-legacy{ background:var(--red-soft); color:var(--red); }
  .finding-item{ font-size:12.5px; color:var(--text-2); padding:10px 14px; border-left:2px solid var(--accent-border); background:var(--surface-2); border-radius:0 8px 8px 0; margin-bottom:8px; }

  /* ---------- Environments ---------- */
  .env-row{ display:flex; gap:10px; align-items:stretch; overflow-x:auto; padding-bottom:8px; }
  .env-box{ min-width:190px; padding:14px; }
  .env-box h4{ margin:0 0 6px; font-size:13px; }
  .env-box p{ margin:0; font-size:11.5px; color:var(--text-2); }
  .env-arrow{ display:flex; align-items:center; color:var(--text-3); font-size:18px; flex-shrink:0; }
  .rel-list{ list-style:none; padding:0; margin:16px 0 0; display:grid; gap:8px; }
  .rel-list li{ font-size:12.5px; color:var(--text-2); padding:9px 12px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; }
  .rel-list li b{ color: var(--text); }
  .provenance-tag{ font-size:10px; padding:2px 7px; border-radius:5px; margin-left:8px; font-weight:700; text-transform:uppercase;}
  .prov-real, .prov-git-derived{ background:var(--green-soft); color:var(--green); }
  .prov-manual, .prov-manually-maintained{ background:var(--gray-soft); color:var(--gray); }
  .prov-hybrid, .prov-not_started---blocked{ background:var(--amber-soft); color:var(--amber); }

  /* ---------- Data & state ---------- */
  .data-cat{ padding:16px; }
  .data-cat h4{ margin:0 0 8px; font-size:13px; display:flex; align-items:center; gap:8px; }
  .data-cat ul{ margin:0; padding-left:18px; color:var(--text-2); font-size:12px; }
  .data-cat li{ margin-bottom:4px; }

  /* ---------- Protocol ---------- */
  table{ width:100%; border-collapse: collapse; font-size:12.5px; }
  table th{ text-align:left; color:var(--text-3); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding:8px 10px; border-bottom:1px solid var(--border-strong); }
  table td{ padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; color: var(--text-2); }
  table td.ix-name{ color: var(--text); font-family:var(--mono); font-weight:600; white-space:nowrap; }
  .subhead{ font-size:14px; font-weight:650; margin: 30px 0 12px; padding-top:8px; border-top:1px solid var(--border); }
  .subhead:first-child{ border-top:none; margin-top:0; }
  .flagtxt{ display:inline-block; margin:2px 6px 2px 0; padding:2px 8px; border-radius:6px; font-size:11px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-2); }
  .kv{ display:grid; grid-template-columns: 160px 1fr; gap:6px 14px; font-size:12.5px; margin-bottom:14px;}
  .kv dt{ color:var(--text-3); }
  .kv dd{ margin:0; color:var(--text-2); }

  /* ---------- Risks ---------- */
  .risk-filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .filter-chip{ all:unset; cursor:pointer; font-size:11.5px; padding:5px 11px; border-radius:999px; border:1px solid var(--border); color:var(--text-2); }
  .filter-chip.active{ background:var(--accent-soft); border-color:var(--accent-border); color:var(--accent-2); }
  .risk-card{ padding:14px 16px; margin-bottom:10px; }
  .risk-card .rtitle{ font-weight:600; font-size:13px; margin-bottom:4px; }
  .risk-card .rdesc{ font-size:12.5px; color:var(--text-2); margin-bottom:8px; }
  .risk-card .raffected{ display:flex; flex-wrap:wrap; gap:6px; }
  .risk-cat-badge{ font-size:10px; text-transform:uppercase; font-weight:700; padding:2px 8px; border-radius:5px; letter-spacing:.03em; }

  .section-note{ font-size:12px; color:var(--text-3); margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
  footer.docfooter{ text-align:center; color:var(--text-3); font-size:11.5px; padding: 30px 0 10px; }
</style>
</head>

    "frontendState": "Hash-routed (no history-API router; a hand-rolled router at src/lib/router.tsx, with a wouter-API-compatible shim so the ported Merge pages needed no rewrite). Real Solana wallet connectivity via @solana/wallet-adapter-react (Wallet Standard, no bundled wallet packages). Real on-chain Reserve discovery (adaptive-polled, no getProgramAccounts -- blocked on public DevNet RPC). Real Buy/Sell, Create, and management transactions signed by the connected wallet. A simulated order book and a hardcoded DevNet test-price table sit underneath otherwise-real trading UI.",
    "protocolState": "Deployed and live on Solana DevNet at program ID 2dURvmSdHeyaFES5rxaE1zgPSHCBLW5BLNguJ2Tu1mkW. 23 instructions covering protocol init, Reserve creation/seeding, in-kind mint/redeem, co-manager permissioning, fee accrual/collection, target-weight updates, composition management (add/fund/remove asset), and staged wind-down/close. 14/14 integration tests pass live against DevNet (tests/ssr_protocol.ts), including a cross-Reserve vault-isolation test the project's own docs call 'the single most important test in this suite'. No mainnet deployment, no external audit, single dev-controlled upgrade authority (flagged for multisig migration before any restricted beta).",
    "environmentState": "Local dev works fully for the frontend (`npm run dev`) but the Solana localnet validator (`solana-test-validator`/`anchor test`) cannot run on the current Windows machine without Developer Mode enabled (symlink privilege error) -- Rust/cargo-build-sbf compiles fine, so localnet testing is a documented, currently-open gap. DevNet is the sole live chain environment and is the source of truth for all 'real' data in this app. Production is a deployed Vercel app at a custom domain, reading/writing the same DevNet program (there is no separate mainnet or staging protocol deployment).",
    "architectureMaturity": "Post-MVP, pre-beta. Roadmap Phases 1-3 (Frontend Foundation, Protocol Research, Solana Architecture) are complete; Phase 4 (Core Solana Program) is 96% and Phase 5 (Client/Frontend Integration) is 99%; Phase 6 (DevNet Testing & Security Validation) is 89%; Phases 7-8 (Restricted Beta, Production Readiness) have not started (0%). See docs/project/PROJECT_STATUS.md for the authoritative, weighted roadmap this summary is derived from -- recompute from that file, do not hand-edit percentages here.",
    "majorArchitecturalBoundaries": [
      "Native design system vs. Merge design system (CSS-token-scoped via `.merge-scope`, two parallel global stores, two parallel toast systems, both mounted for the whole app lifetime).",
      "Simulated-only surfaces (native src/state/store.tsx sandbox, local co-manager CRUD in useAppStore, the DTRDetail simulated order book, hardcoded DevNet test asset prices) vs. real on-chain surfaces (wallet connectivity, Reserve discovery, Create/Buy/Sell/Manage transactions).",
      "Public unauthenticated app surface vs. the single password-gated internal surface (/internal/status, /internal/feedback) behind Vercel Routing Middleware.",
      "Client-exposed config (VITE_* env vars: RPC URL, program ID, cluster) vs. server-only secrets (DEVNET_SWAP_AUTHORITY_SECRET_KEY, HELIUS_RPC_URL, SSR_DASHBOARD_PASSWORD) -- enforced by Vite's VITE_ prefix convention plus a same-origin RPC proxy that never forwards the real Helius URL/API key to the browser.",
      "On-chain program state (Rust/Anchor, authoritative) vs. off-chain descriptive metadata (Reserve name/ticker/logo, resolved from a `metadata_uri` string field the program stores but does not validate)."
    ]

  "risksAndGaps": [
    { "id": "risk.single-upgrade-authority", "category": "security", "title": "Single dev-controlled program upgrade authority", "description": "The Anchor program's upgrade authority is one keypair (6idsSUE6u7fqHg6edrdMEjNTnG62wyCANAsJ2YBmeuHk), not a multisig. Documented as a required migration before any restricted beta (DEC-0015) but not yet done.", "affectedAreas": ["programs/ssr_protocol", "docs/protocol/DEVNET_RUNBOOK.md"] },
    { "id": "risk.shared-devnet-authority-keypair", "category": "security", "title": "One DevNet authority keypair serves four distinct fund-touching roles", "description": "DEVNET_SWAP_AUTHORITY_SECRET_KEY is reused as the swap co-signer, devUSDC mint/freeze authority, SOL sponsor, and test-asset mint authority. Deliberate and documented (Phase B security model), but concentrates risk in one secret, and its SOL balance was recorded at only 0.2345 SOL against 4 duties at last status update.", "affectedAreas": ["api/devnet/_lib/authority.ts", "api/devnet/swap-sign.ts", "api/devnet/sponsor-sol.ts", "api/devnet/faucet-devusdc.ts", "api/devnet/mint-test-assets.ts"] },
    { "id": "risk.asymmetric-cluster-verification", "category": "correctness", "title": "Inconsistent live-DevNet self-verification across fund-touching endpoints", "description": "faucet-devusdc.ts and sponsor-sol.ts call assertDevnetCluster (live genesis-hash check) before touching funds; swap-sign.ts and mint-test-assets.ts do not, despite both being documented as DevNet-only.", "affectedAreas": ["api/devnet/swap-sign.ts", "api/devnet/mint-test-assets.ts", "api/devnet/_lib/network.ts"] },
    { "id": "risk.in-memory-rate-limiting", "category": "security", "title": "All rate limiting/cooldowns are in-memory, non-durable across serverless instances", "description": "Login lockout, faucet/sponsor cooldowns, and rpc-proxy throttling all use module-scope Maps that reset on cold start and are not shared across concurrent Vercel Fluid Compute instances. The project's real defense in every fund-touching case is a live on-chain balance ceiling or atomic program accounting, not these counters -- but this should not be mistaken for a durable rate limit.", "affectedAreas": ["api/dashboard/login.ts", "api/devnet/_lib/rateLimit.ts", "api/devnet/landing-stats.ts"] },
    { "id": "risk.unsanitized-markdown-render", "category": "security", "title": "Dashboard renders maintainer Markdown to HTML with zero sanitization", "description": "lib/dashboard/parseMarkdown.ts pipes `marked` output straight into dangerouslySetInnerHTML. Safe only while docs/project/*.md remains maintainer-only content; would become an XSS vector the moment that trust assumption changes (e.g. accepting docs from external contributors).", "affectedAreas": ["lib/dashboard/parseMarkdown.ts", "src/internal-status/Dashboard.tsx"] },
    { "id": "risk.non-revocable-session-cookie", "category": "security", "title": "Dashboard session cookie has no server-side revocation", "description": "The stateless HMAC-signed session cookie (12h TTL, signing key = the dashboard password itself) cannot be individually revoked; the only way to invalidate a leaked cookie is rotating the shared password, which also breaks login for everyone using the old password.", "affectedAreas": ["lib/dashboard/session.ts"] },
    { "id": "risk.undocumented-env-vars", "category": "documentation-drift", "title": "HELIUS_RPC_URL and SOLANA_RPC_URL are read by server code but absent from .env.example", "description": "api/devnet/_lib/rpc.ts reads both directly; HELIUS_RPC_URL in particular determines whether getProgramAccounts-dependent features (landing-stats holder counts) work in production at all, yet neither variable is documented for a new contributor.", "affectedAreas": [".env.example", "api/devnet/_lib/rpc.ts"] },
    { "id": "risk.simulated-order-book", "category": "simulated-functionality", "title": "Reserve detail page's order book is entirely client-generated", "description": "SimulatedOrderBook has no on-chain counterpart -- there is no real order book for any Reserve. Must not be presented to users or stakeholders as genuine market depth.", "affectedAreas": ["src/merge/pages/DTRDetail.tsx", "src/merge/lib/types.ts"] },

    { "id": "risk.devusdc-conversion-gap", "category": "incomplete-integration", "title": "No real devUSDC-to-Reserve-Asset conversion instruction exists on-chain", "description": "api/devnet/swap-sign.ts explicitly rejects a 'buy-devusdc' request for any Reserve that isn't 100% devUSDC-backed, specifically to avoid the swap authority silently funding non-devUSDC legs for free -- a real integration gap, not a UI-only limitation, and unresolved as of the last decision log entry (DEC-0065).", "affectedAreas": ["api/devnet/swap-sign.ts", "docs/project/DECISION_LOG.md (DEC-0054, DEC-0065, DEC-0067)"] },

    { "id": "risk.unused-native-simulation-layer", "category": "duplication", "title": "The entire native src/state/store.tsx simulation system is unused by any routed page", "description": "Its mint/redeem/rebalance/create-reserve actions and src/data/{assets,reserves,mock}.ts seed data are fully self-contained, in-memory, and not read by Home or any Merge page -- yet still mounted app-wide (its toasts still render in Shell). Represents real duplication/dead-weight risk versus the real useAppStore.", "affectedAreas": ["src/state/store.tsx", "src/data/assets.ts", "src/data/reserves.ts", "src/data/mock.ts"] },
    { "id": "risk.two-parallel-stores-and-toasts", "category": "duplication", "title": "Two global stores and two toast systems run simultaneously for the app's whole lifetime", "description": "Native useStore()/Shell's own toast tray coexist with merge useAppStore()/useToast()+Toaster, mounted at the same time in App.tsx. Increases the chance a future change updates the wrong store or toast system.", "affectedAreas": ["src/App.tsx", "src/state/store.tsx", "src/merge/store/useAppStore.ts", "src/components/Shell.tsx", "src/merge/hooks/use-toast.ts"] },
    { "id": "risk.record-rebalance-unverified-input", "category": "correctness", "title": "record_rebalance trusts caller-supplied 'before' balances", "description": "The on-chain rebalance audit-trail instruction takes balances_before from the caller without independent on-chain verification; only balances_after is read live. Documented as a known limitation, not yet hardened.", "affectedAreas": ["programs/ssr_protocol/src/instructions/record_rebalance.rs"] },
    { "id": "risk.no-real-trade-execution-onchain", "category": "incomplete-integration", "title": "No on-chain rebalance trade execution exists", "description": "record_rebalance only logs a before/after snapshot; there is no program instruction that itself executes a swap/trade as part of rebalancing a Reserve's composition. Any actual rebalancing trade happens off-chain/manually before the log entry is recorded.", "affectedAreas": ["programs/ssr_protocol/src/instructions/record_rebalance.rs", "docs/protocol/RESERVE_REFERENCE_ANALYSIS.md"] },

    { "id": "risk.large-main-bundle", "category": "unresolved-architecture-decision", "title": "Main JS bundle exceeds 500kB", "description": "Flagged as a risk in PROJECT_STATUS.md; no code-splitting/lazy-loading strategy has been recorded as decided or implemented for the Merge pages.", "affectedAreas": ["vite.config.ts", "src/merge/pages/"] },
    { "id": "risk.general-site-relies-on-obscurity", "category": "unclear-ownership", "title": "Broader testing site has no authentication, relying on obscurity by design (DEC-0004/0005)", "description": "Only /internal/status and /internal/feedback are password-gated; the rest of the app (including real fund-touching Buy/Sell/Create flows against a real deployed program) is fully public. This is a recorded, deliberate decision for this testing phase, not an oversight -- but PROJECT_STATUS.md lists whether to move to real auth as an open decision required before further stages.", "affectedAreas": ["middleware.ts", "docs/project/DECISION_LOG.md (DEC-0004, DEC-0005)"] },

    { "id": "risk.second-undocumented-program", "category": "unclear-ownership", "title": "A second program (ssr_devnet_amm) has a generated IDL but no corresponding source directory was found under programs/", "description": "target/idl/ssr_devnet_amm.json exists alongside ssr_protocol's IDL, referenced by the Jupiter-infeasibility decision (DEC-0051) as a deferred experimental AMM, but its resume-or-defer status and current source location are unresolved per PROJECT_STATUS.md's own 'Decisions Required' section.", "affectedAreas": ["target/idl/ssr_devnet_amm.json", "docs/project/PROJECT_STATUS.md"] },

<script>
const DATA = JSON.parse(document.getElementById('arch-data').textContent);
const nodesById = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const flowsById = Object.fromEntries(DATA.flows.map(f => [f.id, f]));

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function statusBadge(status){ return `<span class="badge ${esc(status)}"><span class="dot"></span>${esc(status)}</span>`; }

/* ---------------- Tabs ---------------- */
const TABS = [
  { id:'overview', label:'Overview' },
  { id:'map', label:'System Map' },
  { id:'flows', label:'Flows' },
  { id:'repo', label:'Repository' },
  { id:'env', label:'Environments' },
  { id:'data', label:'Data & State' },
  { id:'protocol', label:'Protocol' },
  { id:'risks', label:'Risks & Gaps' },
];
const tabsEl = document.getElementById('tabs');
TABS.forEach(t => {
  const b = document.createElement('button');
  b.textContent = t.label; b.dataset.tab = t.id;
  b.addEventListener('click', () => showTab(t.id));
  tabsEl.appendChild(b);
});
function showTab(id){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('section.view').forEach(s => s.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  if(id === 'map') requestAnimationFrame(drawFlowLines);
  location.hash = id;
}

/* ---------------- Overview ---------------- */
function renderOverview(){
  const eo = DATA.executiveOverview;
  const el = document.getElementById('view-overview');
  el.innerHTML = `
    <h1 class="page-title">${esc(DATA.project.name)} <span style="color:var(--text-3);font-weight:400;">— Executive Overview</span></h1>
    <p class="page-sub">${esc(DATA.project.oneLiner)} Stack: ${DATA.project.stack.map(s=>`<span class="pill">${esc(s)}</span>`).join(' ')}</p>

    <div class="card overview-hero">
      <h2>What SSR.fun is</h2>
      <p>${esc(eo.whatSsrIs)}</p>
    </div>

    <div class="grid cols-2">
      <div class="card"><h2 style="font-size:14px;margin:0 0 8px;">Product state</h2><p style="color:var(--text-2);font-size:13px;">${esc(eo.currentProductState)}</p></div>
      <div class="card"><h2 style="font-size:14px;margin:0 0 8px;">Frontend state</h2><p style="color:var(--text-2);font-size:13px;">${esc(eo.frontendState)}</p></div>
      <div class="card"><h2 style="font-size:14px;margin:0 0 8px;">Protocol state</h2><p style="color:var(--text-2);font-size:13px;">${esc(eo.protocolState)}</p></div>
      <div class="card"><h2 style="font-size:14px;margin:0 0 8px;">Environment state</h2><p style="color:var(--text-2);font-size:13px;">${esc(eo.environmentState)}</p></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <h2 style="font-size:14px;margin:0 0 10px;">Architecture maturity</h2>
      <p style="color:var(--text-2);font-size:13px;">${esc(eo.architectureMaturity)}</p>
    </div>

    <div class="grid cols-2" style="margin-top:14px;">
      <div class="card">
        <h2 style="font-size:14px;margin:0 0 6px;">Roadmap (from PROJECT_STATUS.md)</h2>
        <div id="roadmap-bars"></div>
      </div>
      <div class="card">
        <h2 style="font-size:14px;margin:0 0 10px;">Major architectural boundaries</h2>
        <ul class="boundary-list">${eo.majorArchitecturalBoundaries.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
      </div>
    </div>
  `;
  // static roadmap snapshot mirrored from PROJECT_STATUS.md (see docs/project/PROJECT_STATUS.md for the live, authoritative figures)
  const roadmap = [
    ['1. Frontend Foundation', 100],['2. Protocol Research & Gap Analysis', 100],['3. Solana Reserve Architecture', 100],
    ['4. Core Solana Program', 96],['5. Client & Frontend Integration', 99],['6. DevNet Testing & Security Validation', 89],
    ['7. Restricted Beta', 0],['8. Production Readiness', 0],
  ];
  document.getElementById('roadmap-bars').innerHTML = roadmap.map(([name,pct]) => `
    <div class="phase-row"><div class="name">${esc(name)}</div><div class="maturity-bar" style="flex:2;"><div style="width:${pct}%"></div></div><div class="pct">${pct}%</div></div>
  `).join('');
}

/* ---------------- System Map ---------------- */
let activeFlow = null;
function renderSystemMap(){
  const el = document.getElementById('view-map');
  el.innerHTML = `
    <h1 class="page-title">Interactive System Map</h1>
    <p class="page-sub">Every column is an architectural layer; every chip is a real unit of the system with a verified status. Click any node for detail. Use the flow lens below to trace an end-to-end journey — related nodes light up, unrelated nodes dim, and the path is drawn in order.</p>
    <div class="map-toolbar">
      <label for="flow-lens" style="color:var(--text-2);font-size:13px;">Flow lens:</label>
      <select id="flow-lens">
        <option value="">— None (show full map) —</option>
        ${DATA.flows.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('')}
      </select>
    </div>
    <div class="card flow-status-line" id="flow-status-line"></div>
    <div class="map-scroll">
      <div class="map-content" id="map-content">
        <svg class="map-lines" id="map-lines"></svg>
        <div class="map-columns" id="map-columns"></div>
      </div>
    </div>
  `;
  const cols = document.getElementById('map-columns');
  cols.innerHTML = DATA.layers.map(layer => {
    const nodes = DATA.nodes.filter(n => n.layer === layer.id);
    return `<div class="map-col">
      <div class="map-col-head">${esc(layer.label)}</div>
      ${nodes.map(n => `
        <div class="node-chip" data-node="${n.id}" title="${esc(layer.description)}">
          <span class="status-dot ${esc(n.status)}"></span>
          <div class="label">${esc(n.label)}</div>
          <div class="kind">${esc(n.kind)}</div>
        </div>
      `).join('')}
    </div>`;
  }).join('');

  cols.querySelectorAll('.node-chip').forEach(chip => {
    chip.addEventListener('click', () => openNodePanel(chip.dataset.node));
  });

  document.getElementById('flow-lens').addEventListener('change', (e) => {
    applyFlowLens(e.target.value);
  });
  window.addEventListener('resize', () => { if(activeFlow) drawFlowLines(); });
}

function applyFlowLens(flowId){
  activeFlow = flowId || null;
  const statusLine = document.getElementById('flow-status-line');
  const chips = document.querySelectorAll('.node-chip');
  if(!activeFlow){
    chips.forEach(c => c.classList.remove('dimmed','highlighted'));
    statusLine.classList.remove('show');
    document.getElementById('map-lines').innerHTML = '';
    return;
  }
  const flow = flowsById[activeFlow];
  const involved = new Set(flow.nodeIds || []);
  chips.forEach(c => {
    if(involved.has(c.dataset.node)){ c.classList.add('highlighted'); c.classList.remove('dimmed'); }
    else { c.classList.add('dimmed'); c.classList.remove('highlighted'); }
  });
  statusLine.classList.add('show');
  statusLine.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <strong style="font-size:14px;">${esc(flow.name)}</strong> ${statusBadge(flow.status)}
    </div>
    <p style="color:var(--text-2);font-size:13px;margin:0 0 12px;">${esc(flow.summary)}</p>
    <div>${(flow.steps||[]).map(s => `
      <div class="step-item">
        <div class="step-num">${s.n}</div>
        <div style="flex:1;">
          <div class="step-desc">${esc(s.description)}</div>
          <div>${(s.files||[]).map(f=>`<span class="file-chip">${esc(f)}</span>`).join('')}</div>
        </div>
      </div>`).join('')}
    </div>
    ${(flow.limitations && flow.limitations.length) ? `<div style="margin-top:10px;">${flow.limitations.map(l=>`<div class="limitation-item">⚠ ${esc(l)}</div>`).join('')}</div>` : ''}
  `;
  requestAnimationFrame(drawFlowLines);
}

function drawFlowLines(){
  const svg = document.getElementById('map-lines');
  const content = document.getElementById('map-content');
  if(!svg || !content) return;
  if(!activeFlow){ svg.innerHTML=''; return; }
  const flow = flowsById[activeFlow];
  const contentRect = content.getBoundingClientRect();
  const w = content.scrollWidth, h = content.scrollHeight;
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const pts = (flow.nodeIds||[]).map(id => {
    const chip = document.querySelector(`.node-chip[data-node="${id}"]`);
    if(!chip) return null;
    const r = chip.getBoundingClientRect();
    return { x: r.left - contentRect.left + r.width/2, y: r.top - contentRect.top + r.height/2 };
  }).filter(Boolean);
  let path = '';
  for(let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1];
    const midX = (a.x + b.x) / 2;
    path += `M ${a.x} ${a.y} C ${midX} ${a.y}, ${midX} ${b.y}, ${b.x} ${b.y} `;
  }
  svg.innerHTML = `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.75" stroke-opacity="0.55" stroke-dasharray="5,5"/>
    ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--accent-2)"/>`).join('')}`;
}

/* ---------------- Node detail panel ---------------- */
function openNodePanel(nodeId){
  const n = nodesById[nodeId];
  if(!n) return;
  document.getElementById('panel-title').textContent = n.label;
  document.getElementById('panel-status').outerHTML = statusBadge(n.status).replace('<span class="badge','<span id="panel-status" class="badge');
  const layer = DATA.layers.find(l => l.id === n.layer);
  const body = document.getElementById('panel-body');
  const consumers = (n.consumedBy||[]).map(id => nodesById[id] ? `<span class="rel-chip" data-goto="${id}">${esc(nodesById[id].label)}</span>` : '').join('');
  const deps = (n.dependsOn||[]).map(id => nodesById[id] ? `<span class="rel-chip" data-goto="${id}">${esc(nodesById[id].label)}</span>` : '').join('');
  const flows = (n.relatedFlows||[]).map(id => flowsById[id] ? `<span class="rel-chip" data-flow="${id}">${esc(flowsById[id].name)}</span>` : '').join('');
  body.innerHTML = `
    <div class="panel-section">
      <h4>Layer</h4><div>${esc(layer ? layer.label : n.layer)} · <span class="mono" style="color:var(--text-3);">${esc(n.kind)}</span></div>
    </div>
    <div class="panel-section"><h4>Purpose</h4><div style="font-size:13px;color:var(--text-2);">${esc(n.purpose||'—')}</div></div>
    ${n.environment ? `<div class="panel-section"><h4>Environment</h4><div style="font-size:13px;color:var(--text-2);">${esc(n.environment)}</div></div>` : ''}
    <div class="panel-section"><h4>Files</h4><div>${(n.files&&n.files.length) ? n.files.map(f=>`<span class="file-chip">${esc(f)}</span>`).join('') : '<span style="color:var(--text-3);font-size:12.5px;">no specific files (conceptual/external node)</span>'}</div></div>
    ${deps ? `<div class="panel-section"><h4>Depends on</h4><div>${deps}</div></div>` : ''}
    ${consumers ? `<div class="panel-section"><h4>Consumed by</h4><div>${consumers}</div></div>` : ''}
    ${flows ? `<div class="panel-section"><h4>Related flows</h4><div>${flows}</div></div>` : ''}
    ${(n.limitations&&n.limitations.length) ? `<div class="panel-section"><h4>Known limitations / uncertainty</h4>${n.limitations.map(l=>`<div class="limitation-item">⚠ ${esc(l)}</div>`).join('')}</div>` : ''}
  `;
  body.querySelectorAll('[data-goto]').forEach(el => el.addEventListener('click', () => openNodePanel(el.dataset.goto)));
  body.querySelectorAll('[data-flow]').forEach(el => el.addEventListener('click', () => {
    closePanel(); showTab('map');
    const sel = document.getElementById('flow-lens'); if(sel){ sel.value = el.dataset.flow; applyFlowLens(el.dataset.flow); }
  }));
  document.getElementById('overlay').classList.add('show');
  document.getElementById('panel').classList.add('show');
}
function closePanel(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('panel').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click', closePanel);
document.getElementById('panel-close').addEventListener('click', closePanel);

/* ---------------- Flows tab ---------------- */
function renderFlows(){
  const el = document.getElementById('view-flows');
  el.innerHTML = `
    <h1 class="page-title">Application Flows</h1>
    <p class="page-sub">End-to-end journeys through the system. Each flow states its real/simulated/hybrid status honestly — a flow existing in code does not mean it is fully wired to real chain state.</p>
    <div class="flow-list" id="flow-list"></div>
    <div id="flow-detail-container"></div>
  `;
  const list = document.getElementById('flow-list');
  list.innerHTML = DATA.flows.map(f => `
    <div class="card flow-card" data-flow="${f.id}">
      <div><div class="fname">${esc(f.name)}</div><div class="fcat">${esc(f.category)} · ${(f.steps||[]).length} steps</div></div>
      ${statusBadge(f.status)}
    </div>
  `).join('');
  list.querySelectorAll('.flow-card').forEach(c => c.addEventListener('click', () => renderFlowDetail(c.dataset.flow)));
}
function renderFlowDetail(flowId){
  const f = flowsById[flowId];
  const c = document.getElementById('flow-detail-container');
  c.innerHTML = `
    <button class="back-link" id="flow-back">&larr; Back to all flows</button>
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <h2 style="font-size:16px;margin:0;">${esc(f.name)}</h2>${statusBadge(f.status)}
        <button class="filter-chip" id="view-in-map" style="margin-left:auto;">View in System Map →</button>
      </div>
      <p style="color:var(--text-2);font-size:13px;">${esc(f.summary)}</p>
      <div style="margin-top:14px;">
        ${(f.steps||[]).map(s => `
          <div class="step-item">
            <div class="step-num">${s.n}</div>
            <div style="flex:1;">
              <div class="step-desc">${esc(s.description)}</div>
              <div>${(s.files||[]).map(file=>`<span class="file-chip">${esc(file)}</span>`).join('')}</div>
            </div>
          </div>`).join('')}
      </div>
      ${(f.limitations && f.limitations.length) ? `<div style="margin-top:14px;">${f.limitations.map(l=>`<div class="limitation-item">⚠ ${esc(l)}</div>`).join('')}</div>` : ''}
    </div>
  `;
  document.getElementById('flow-back').addEventListener('click', () => { c.innerHTML=''; });
  document.getElementById('view-in-map').addEventListener('click', () => {
    showTab('map');
    const sel = document.getElementById('flow-lens'); sel.value = flowId; applyFlowLens(flowId);
  });
  c.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---------------- Repository explorer ---------------- */
function renderRepo(){
  const el = document.getElementById('view-repo');
  el.innerHTML = `
    <h1 class="page-title">Repository Explorer</h1>
    <p class="page-sub">Files grouped by architectural responsibility, not a flat directory dump. Each group is classified so it's clear what's active product code versus generated, inactive, or uncertain.</p>
    <div id="repo-groups"></div>
    <div class="card" style="margin-top:18px;">
      <h2 style="font-size:14px;margin:0 0 10px;">Notable findings</h2>
      ${DATA.repository.notableFindings.map(f => `<div class="finding-item">${esc(f)}</div>`).join('')}
    </div>
  `;
  const groups = document.getElementById('repo-groups');
  groups.innerHTML = DATA.repository.groups.map(g => `
    <details class="repo-group card">
      <summary>
        <span class="rg-title">${esc(g.label)}</span>
        <span class="class-badge class-${esc(g.classification)}">${esc(g.classification.replace(/-/g,' '))}</span>
      </summary>
      <div class="rg-body">
        <div>${esc(g.description)}</div>
        <div class="rg-paths">${g.paths.map(p=>`<span class="file-chip">${esc(p)}</span>`).join('')}</div>
      </div>
    </details>
  `).join('');
}

/* ---------------- Environments ---------------- */
function renderEnv(){
  const el = document.getElementById('view-env');
  const e = DATA.environments;
  const boxes = [
    ['local','Local'], ['claudeCodeWorkflow','Claude Code Workflow'], ['github','GitHub'], ['branches','Branches'],
    ['vercel','Vercel'], ['productionDomain','Production'], ['solanaLocalValidation','Solana Local Validator'],
    ['solanaDevnet','Solana DevNet'], ['simulationMode','Simulation Mode'], ['internalStatusDashboard','Internal Status Dashboard'],
  ];
  el.innerHTML = `
    <h1 class="page-title">Environment Map</h1>
    <p class="page-sub">How Local, Claude Code, GitHub, Vercel, Production, and the two Solana environments relate — with confirmed Git-derived facts distinguished from manually-maintained infrastructure metadata.</p>
    <div class="grid cols-3" id="env-boxes"></div>
    <div class="card" style="margin-top:18px;">
      <h2 style="font-size:14px;margin:0 0 4px;">Relationships</h2>
      <ul class="rel-list">${e.relationships.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
    </div>
  `;
  document.getElementById('env-boxes').innerHTML = boxes.map(([key,label]) => {
    const d = e[key]; if(!d) return '';
    const provClass = 'prov-' + (d.provenance||'').split(' ')[0].split('(')[0].trim().toLowerCase().replace(/[^a-z_-]/g,'-');
    return `<div class="card env-box">
      <h4>${esc(label)}</h4>
      <p>${esc(d.status)}</p>
      <p style="margin-top:8px;">${esc(d.description)}</p>
      <div style="margin-top:8px;"><span class="provenance-tag ${provClass}">${esc(d.provenance||'unspecified')}</span></div>
    </div>`;

/* ---------------- Risks ---------------- */
function renderRisks(){
  const el = document.getElementById('view-risks');
  const cats = [...new Set(DATA.risksAndGaps.map(r => r.category))];
  el.innerHTML = `
    <h1 class="page-title">Risks & Architectural Gaps</h1>
    <p class="page-sub">Incompleteness, simulation, duplication, and open decisions surfaced deliberately rather than silently resolved. ${DATA.risksAndGaps.length} items tracked.</p>
    <div class="risk-filters" id="risk-filters"></div>
    <div id="risk-list"></div>
  `;
  const catColor = (c) => {
    const map = { security:'red', 'incomplete-integration':'amber', 'simulated-functionality':'gray', duplication:'blue',
      'stale-documentation':'gray', 'documentation-drift':'gray', 'missing-tests':'amber', 'unclear-ownership':'blue',
      'environment-coupling':'blue', 'manual-deployment-steps':'blue', 'unresolved-architecture-decision':'amber', correctness:'red' };
    return map[c] || 'gray';
  };
  const filters = document.getElementById('risk-filters');
  filters.innerHTML = `<button class="filter-chip active" data-cat="">All (${DATA.risksAndGaps.length})</button>` +
    cats.map(c => `<button class="filter-chip" data-cat="${esc(c)}">${esc(c.replace(/-/g,' '))}</button>`).join('');
  function renderList(filter){
    document.getElementById('risk-list').innerHTML = DATA.risksAndGaps.filter(r => !filter || r.category === filter).map(r => {
      const col = catColor(r.category);
      return `<div class="card risk-card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
          <span class="risk-cat-badge" style="background:var(--${col}-soft);color:var(--${col});">${esc(r.category.replace(/-/g,' '))}</span>
          <div class="rtitle">${esc(r.title)}</div>
        </div>
        <div class="rdesc">${esc(r.description)}</div>
        <div class="raffected">${(r.affectedAreas||[]).map(a=>`<span class="file-chip">${esc(a)}</span>`).join('')}</div>
      </div>`;
    }).join('');
  }
  filters.querySelectorAll('.filter-chip').forEach(b => b.addEventListener('click', () => {
    filters.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); renderList(b.dataset.cat);
  }));
  renderList('');
}
